security:
    password_hashers:
        # Our user class and the algorithm we'll use to encode passwords
        # 'auto' means to let Symfony choose the best possible password hasher (Argon2 or Bcrypt)
        # https://symfony.com/doc/current/security.html#c-encoding-passwords
        App\Entity\User: 'auto'

    providers:
        users_in_memory: { memory: null }
        # https://symfony.com/doc/current/security/user_provider.html
        # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
        # In this example, users are stored via Doctrine in the database
        # To see the users at src/App/DataFixtures/ORM/LoadFixtures.php
        # To load users from somewhere else: https://symfony.com/doc/current/security/user_provider.html#creating-a-custom-user-provider
        database_users:
            entity: { class: App\Entity\User, property: email }


    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: database_users
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_inventory
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: '^/(login|register)$', roles: PUBLIC_ACCESS }
        - { path: '^/(inventory|building|basic-ajax)(/|$)', roles: ROLE_USER }
        - { path: '^/api/(locations|building)(/|$|\.)', roles: ROLE_USER }
        - { path: '^/(load-topics|load-files|file-source|repo-files|file-overview)(/|$)', roles: ROLE_ADMIN }
        - { path: '^/api/files(/|$|\.)', roles: ROLE_ADMIN }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@prod:
    security:
        access_control:
            - { path: '^/(admin|load-topics|load-files|file-source|repo-files)(/|$)', roles: ROLE_ADMIN }
            - { path: '^/api/(locations|building)(/|$|\.)', roles: ROLE_USER }
            - { path: '^/api', methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
            - { path: '^/(building|location|file)(/.*)?/(new|edit|delete)(/|$)', roles: ROLE_ADMIN }
            - { path: '^/', methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
